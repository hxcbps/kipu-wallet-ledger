services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kipu
      POSTGRES_PASSWORD: kipu
      POSTGRES_DB: kipu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kipu -d kipu"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - kipu_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  kipu_postgres_data:
